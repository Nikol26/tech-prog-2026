[pytest]
testpaths = lab5/tests lab4/test_game.py
pythonpath = lab4
addopts = -ra --strict-markers
markers =
    unit: изолированная проверка паттерна или механики
    integration: настоящий JSON и файловая система
    e2e: пользовательский путь через консоль в отдельном процессе
    smoke: быстрая проверка запуска игры
